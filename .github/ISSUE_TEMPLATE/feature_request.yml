name: Feature request
description: Propose a focused improvement to PlexDeathCoords.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the problem a player or server administrator encounters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe existing commands, configuration, or other approaches you considered.
