name: Bug report
description: Report a reproducible problem with PlexDeathCoords.
title: '[Bug]: '
body:
  - type: input
    id: plugin-version
    attributes:
      label: PlexDeathCoords version
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Paper and Minecraft version
      description: Include the full server version from /version.
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      description: Include the output of java -version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include relevant commands and configuration changes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, passwords, and private player data before posting.
      render: text
